# SLSA provenance for release artifacts (the packaged crates).
#
# The generation satisfies level 3 for the provenance requirements - see https://slsa.dev/spec/v0.1/requirements
# The project is an initiative of the OpenSSF (openssf.org) and is developed at
# https://github.com/slsa-framework/slsa-github-generator.
# The provenance file can be verified using https://github.com/slsa-framework/slsa-verifier.
# For more information about SLSA and how it improves the supply-chain, visit slsa.dev.
#
# Verify a downloaded crate with:
#   slsa-verifier verify-artifact <name>-<version>.crate \
#     --provenance-path multiple.intoto.jsonl \
#     --source-uri github.com/Astute-Systems/cot-tak \
#     --source-tag <tag>

name: SLSA provenance

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: read-all

jobs:
  # Build the artifacts and compute their subject hashes.
  build:
    name: build
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v7

      - run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Package crates
        run: cargo package --workspace --no-verify

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp target/package/*.crate dist/

      - name: Generate subject hashes
        id: hash
        working-directory: dist
        run: |
          set -euo pipefail
          echo "hashes=$(sha256sum ./*.crate | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: crates
          path: dist/*.crate
          if-no-files-found: error
          retention-days: 5

  # Generate SLSA level 3 provenance. Must reference the generator by tag, not by SHA.
  provenance:
    name: provenance
    needs: [build]
    permissions:
      actions: read # detect the GitHub Actions environment
      id-token: write # sign the provenance with the workflow identity (OIDC)
      contents: write # upload provenance to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: ${{ github.event_name == 'release' }}
