name: "Ubuntu 24.04 Intel"

on:
  push:
    branches: main
  pull_request:
    branches: main

permissions:
  contents: read
  pull-requests: read

jobs:
  build-ubuntu:
    runs-on: ubuntu-24.04

    # Map a step output to a job output
    outputs:
      package_name: ${{ steps.package.outputs.DEB_PACKAGE }}
    steps:
      - uses: actions/checkout@v3
      - name: Apt Update
        run: |
          sudo apt-get update

      - name: Rust Setup
        run: |
          sudo ./scripts/init-build-machine.sh

      - name: Build
        run: |
          source ~/.cargo/env
          cargo --version
          cargo build --release

      - name: Test
        run: |
          # cargo test --release

      - name: Package
        run: |
          cargo build --release

      - name: Run the .deb package
        run: |
          echo "Test the Package here"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEB_PACKAGE_NAME }}
          path: target/debian/${{ env.DEB_PACKAGE }}
