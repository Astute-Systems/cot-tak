[workspace]
resolver = "3"
members = [
    "crates/cottak-core",
    "crates/cottak-proto",
    "crates/cottak-net",
    "crates/cottak-enroll",
    "crates/cottak-marti",
    "crates/cottak-convert",
    "crates/cottak-server",
    "crates/cottak",
]
exclude = ["fuzz"]

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Ross Newman <ross.newman@astutesys.com>"]
repository = "https://github.com/Astute-Systems/cot-tak"
homepage = "https://astutesys.com/tak/"
keywords = ["tak", "cot", "cursor-on-target", "atak", "geospatial"]
categories = ["network-programming", "parser-implementations", "encoding"]

[workspace.dependencies]
cottak-core = { path = "crates/cottak-core", version = "2.0.0" }
cottak-proto = { path = "crates/cottak-proto", version = "2.0.0" }
cottak-net = { path = "crates/cottak-net", version = "2.0.0" }
cottak-enroll = { path = "crates/cottak-enroll", version = "2.0.0" }
cottak-marti = { path = "crates/cottak-marti", version = "2.0.0" }
cottak-convert = { path = "crates/cottak-convert", version = "2.0.0" }
cottak-server = { path = "crates/cottak-server", version = "2.0.0" }

quick-xml = "0.42"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
proptest = "1"
prost = "0.14"
prost-build = "0.14"
protox = "0.10"
bytes = "1"
tokio = { version = "1", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
socket2 = { version = "0.6", features = ["all"] }
fastrand = "2"
base64 = "0.22"
url = "2"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
p12-keystore = "0.4"
sha2 = "0.10"
tracing = "0.1"
rcgen = "0.14"
tokio-util = { version = "0.7", features = ["codec"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# zip needs a backend chosen; the pure-Rust miniz_oxide one keeps the build free of C code.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
