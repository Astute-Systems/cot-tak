[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "BSD-3-Clause", "ISC", "Zlib", "CC0-1.0", "CDLA-Permissive-2.0"]
confidence-threshold = 0.9
# The TAK Protocol schema files are derived from TAK Server (GPL-3.0); see
# crates/cottak-proto/proto/NOTICE.md.
exceptions = [{ allow = ["GPL-3.0-only"], crate = "cottak-proto" }]

[bans]
multiple-versions = "warn"
# The project is deliberately OpenSSL-free (rustls only).
deny = [{ name = "openssl" }, { name = "openssl-sys" }, { name = "native-tls" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
