[package]
name = "cottak-enroll"
description = "TAK Server certificate enrollment (tak:// onboarding, CSR, signClient) for cottak"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Read PKCS#12 (.p12) client identities, for example from TAK data packages
pkcs12 = ["dep:p12-keystore"]

[dependencies]
cottak-core = { workspace = true }
cottak-net = { workspace = true }
rustls = { workspace = true }
reqwest = { workspace = true }
rcgen = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
tokio = { workspace = true, features = ["time"] }
p12-keystore = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
tokio-rustls = { workspace = true }
rcgen = { workspace = true, features = ["x509-parser"] }
base64 = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
